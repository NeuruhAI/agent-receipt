[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuruh-agent-receipt"
version = "0.1.0"
description = "Portable tamper-evident receipt specification and verifier for agent systems"
requires-python = ">=3.10"
authors = [{name = "Jeramie Hicks / Neuruh"}]
readme = "README.md"
license = {text = "LICENSE DECISION PENDING"}

[project.scripts]
neuruh-agent-receipt = "neuruh_agent_receipt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
